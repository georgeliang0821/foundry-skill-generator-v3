[project]
name = "poc-skill-generator-using-chat"
version = "0.1.0"
description = "FastAPI + vanilla JS Skill Generator v2"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "azure-identity>=1.17.0",
    "agent-framework-foundry==1.0.0rc6",
    "agent-framework==1.0.0rc6",
    "azure-ai-projects>=2.1.0",
    "azure-storage-blob>=12.19.0",
    "mssql-python>=1.7.1",
]

[project.scripts]
skill-generator-v2 = "backend.main:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[tool.uv]
package = true
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]
